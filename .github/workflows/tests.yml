name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (nur Standardbibliothek, kein Modell nötig)
        run: python -m unittest discover -s tests -v
      - name: CLI-Hilfe
        run: python -m obito --help
