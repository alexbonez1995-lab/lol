[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obito"
version = "4.0.0"
description = "OBITO – lokale, lernfähige KI-Engineering-Plattform (Gedächtnis, Expertengremium, Werkzeuge, Projekte, Missionen, Training)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OBITO" }]
keywords = ["ki", "ollama", "lokal", "offline", "engineering", "drohnen", "lora"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Natural Language :: German",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Der Kern braucht keine Abhängigkeiten – nur die Python-Standardbibliothek und Ollama.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
seriell = ["pyserial>=3.5"]          # serielle Telemetrie unter Windows (Linux/macOS geht auch ohne)
fenster = ["pywebview>=5"]           # eigenes App-Fenster statt Edge/Chrome-App-Modus
exe = ["pyinstaller>=6"]             # build_exe.bat → dist/OBITO/OBITO.exe
training = ["torch", "transformers>=4.40", "peft>=0.10", "datasets", "accelerate"]
training-qlora = ["bitsandbytes"]
training-dpo = ["trl>=0.9"]

[project.scripts]
obito = "obito.cli:main"

[project.urls]
Dokumentation = "https://github.com/alexbonez1995-lab/lol"

[tool.setuptools]
packages = ["obito", "obito.training"]
include-package-data = true

[tool.setuptools.package-data]
obito = ["static/*.html"]
